# Interceptor Validation Rules – Phase 2 Domain Agent

when:
  topic: aacp.domain.riskvariance.recommend.v1

validate:
  - auditEnvelope.present == true
  - auditEnvelope.version == "v1"
  - auditEnvelope.permit_status in ["PENDING","DENIED"]
  - meta.intent == "RECOMMENDATION"
  - meta.intent != "EXECUTE"
  - policy.scope == "risk-variance-phase2"
  - signature.verified == true
  - channel.wildcard == false

onFail:
  action: REJECT_AND_DLQ
  reason: "Phase2 domain agent guardrail violation"