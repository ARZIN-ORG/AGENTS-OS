apiVersion: aacp.arzin.io/v1
kind: PolicyBinding
metadata:
  name: risk-variance-phase2
  version: "1.0.0"
spec:
  scope: "risk-variance-phase2"
  allowedTopics:
    publish:
      - "aacp.domain.riskvariance.recommend.v1"
    consume:
      - "aacp.permit.status.v1"
  constraints:
    recommendationOnly: true
    requiresHumanApproval: true
    forbidden:
      - "EXECUTE"
      - "AUTO_APPROVE"
  thresholds:
    minConfidenceToShow: 0.60
    minImpactToPrioritize: 0.20
  audit:
    required: true
    failClosed: true
