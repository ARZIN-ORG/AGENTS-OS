apiVersion: aacp.arzin.io/v1
kind: AgentContract
metadata:
  name: operational-risk-variance-advisor
  agentId: arz.domain.operational_risk_variance_advisor
  owner:
    organization: "ARZIN"
    contact: "governance-console"
  version: "1.0.0"
  lifecycle:
    phase: "PHASE1_2_LOCKED"
    decisionAuthority: "HUMAN_ONLY"
  labels:
    layer: "DOMAIN"
    mode: "RECOMMENDATION_ONLY"
    marketplaceEligible: "PHASE2_GATE"
spec:
  purpose: >
    Detect operational risk signals and performance variance across units, then emit
    recommendation events with auditable evidence. Never executes actions.
  guardrails:
    decisionMaking: "FORBIDDEN"
    execution: "FORBIDDEN"
    intentAllowed:
      - "RECOMMENDATION"
    forbiddenIntents:
      - "EXECUTE"
      - "AUTO_APPROVE"
    failClosedRules:
      - "Missing audit envelope => REJECT"
      - "Signature verify fail => REJECT"
      - "Policy scope mismatch => REJECT"
      - "Channel wildcard => REJECT"
      - "permit_status not in {PENDING,DENIED} => REJECT"
  policyBinding:
    policyScope: "risk-variance-phase2"
    resolver: "policy-plane"
    permitService: "permit-service"
    humanApprovalFlow:
      required: true
      channel: "governance-console"
      flow: "Intent->Review->Confirm->Permit->Execute->Audit"
  channels:
    publish:
      - topic: "aacp.domain.riskvariance.recommend.v1"
        qos:
          delivery: "AT_LEAST_ONCE"
          orderingKey: "trace_id"
        maxPayloadBytes: 262144
    consume:
      - topic: "aacp.permit.status.v1"
        filter:
          correlationField: "payload.correlation_id"
  schema:
    schemaVersion: "1.0"
    message:
      requiredTopLevel:
        - "schema_version"
        - "payload"
        - "audit"
        - "meta"
      payload:
        required:
          - "correlation_id"
          - "unit_id"
          - "metric_type"
          - "baseline_value"
          - "current_value"
          - "variance_percent"
          - "suggested_action"
          - "confidence"
          - "impact_estimate"
          - "evidence_refs"
        types:
          correlation_id: "string"
          unit_id: "string"
          metric_type: "string"
          baseline_value: "number"
          current_value: "number"
          variance_percent: "number"
          suggested_action: "string"
          confidence: "number"
          impact_estimate: "number"
          evidence_refs: "array[string]"
      meta:
        required:
          - "agent_version"
          - "data_source"
          - "intent"
        types:
          agent_version: "string"
          data_source: "string"
          intent: "string"
  auditEnvelope:
    version: "v1"
    mandatoryFields:
      - "trace_id"
      - "message_id"
      - "schema_version"
      - "timestamp_ms"
      - "producer_id"
      - "consumer_id"
      - "channel"
      - "policy_scope"
      - "signature_alg"
      - "signature"
      - "chain_hash"
      - "permit_status"
      - "audit_version"
    constraints:
      permit_status_allowed:
        - "PENDING"
        - "DENIED"
      signature_alg_allowed:
        - "RSA-SHA256"
        - "ECDSA-P256-SHA256"
      chain_hash_required: true
  security:
    mtls:
      required: true
      clientCertSource: "privatecloud-pki"
    signatures:
      verifyRequired: true
      keySource: "keystore/hsm"
      rotation: "mandatory"
    rateLimits:
      publishPerSecond: 50
      burst: 200
  observability:
    required:
      - "trace_id"
      - "correlation_id"
      - "agent_version"
    metrics:
      - name: "recommendation_emitted_total"
        type: "counter"
      - name: "recommendation_rejected_total"
        type: "counter"
      - name: "variance_detected_gauge"
        type: "gauge"
      - name: "decision_latency_ms"
        type: "histogram"
  slos:
    availability: "99.9%"
    p95_end_to_end_latency_ms: 1500
    max_recommendations_per_minute: 2000
