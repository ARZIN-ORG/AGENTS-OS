openapi: 3.0.3
info:
  title: ARZIN Permit Service
  version: "1.0"
servers:
  - url: http://permit-service:8082
paths:
  /health:
    get:
      responses: { "200": { description: OK } }
  /v1/permit:
    post:
      summary: Evaluate permit for a single message
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PermitRequest" }
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PermitDecision" }
components:
  schemas:
    PermitRequest:
      type: object
      required:
        - agent_id
        - agent_class
        - channel_id
        - topic
        - envelope
      properties:
        agent_id: { type: string }
        agent_class: { type: string }
        channel_id: { type: string }
        topic: { type: string }
        envelope:
          type: object
          required:
            - trace_id
            - ttl_seconds
            - payload_bytes
            - signature_valid
          properties:
            trace_id: { type: string }
            ttl_seconds: { type: integer }
            payload_bytes: { type: integer }
            signature_valid: { type: boolean }
    PermitDecision:
      type: object
      required:
        - decision
        - reason
        - trace_id
      properties:
        decision: { type: string, enum: [ALLOW, DENY] }
        reason: { type: string }
        policy_id: { type: string }
        policy_version: { type: integer }
        trace_id: { type: string }
