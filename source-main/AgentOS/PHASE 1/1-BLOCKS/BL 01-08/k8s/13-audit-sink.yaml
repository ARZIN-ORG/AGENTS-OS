apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-sink
  namespace: arzin-aacp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-sink
  template:
    metadata:
      labels:
        app: audit-sink
    spec:
      containers:
        - name: audit-sink
          image: arzin/bl08-audit-sink:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: aacp-config
            - secretRef:
                name: aacp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-sink
  namespace: arzin-aacp
spec:
  selector:
    app: audit-sink
  ports:
    - name: http
      port: 8083
      targetPort: 8083
