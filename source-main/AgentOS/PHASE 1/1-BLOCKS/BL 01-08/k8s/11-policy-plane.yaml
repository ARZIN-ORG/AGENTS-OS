apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-plane
  namespace: arzin-aacp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-plane
  template:
    metadata:
      labels:
        app: policy-plane
    spec:
      containers:
        - name: policy-plane
          image: arzin/bl07-policy-plane:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: aacp-config
            - secretRef:
                name: aacp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: policy-plane
  namespace: arzin-aacp
spec:
  selector:
    app: policy-plane
  ports:
    - name: http
      port: 8081
      targetPort: 8081
