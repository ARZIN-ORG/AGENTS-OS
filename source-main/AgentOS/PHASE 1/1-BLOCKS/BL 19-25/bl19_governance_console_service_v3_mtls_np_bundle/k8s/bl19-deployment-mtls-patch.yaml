apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl19-governance-console
spec:
  template:
    spec:
      containers:
        - name: bl19
          env:
            - name: AUDIT_SINK_URL
              value: "https://audit-sink:8443"
            - name: AUDIT_SINK_MTLS_ENABLED
              value: "true"
            - name: AUDIT_SINK_MTLS_CA_CERT
              value: "/certs/ca.crt"
            - name: AUDIT_SINK_MTLS_CLIENT_CERT
              value: "/certs/tls.crt"
            - name: AUDIT_SINK_MTLS_CLIENT_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: bl19-mtls-client
              mountPath: /certs
              readOnly: true
            - name: bl19-mtls-ca
              mountPath: /certs/ca
              readOnly: true
      volumes:
        - name: bl19-mtls-client
          secret:
            secretName: bl19-mtls-client
        - name: bl19-mtls-ca
          secret:
            secretName: bl19-mtls-ca
