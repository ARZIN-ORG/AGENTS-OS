apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-gateway
spec:
  template:
    spec:
      containers:
        - name: intent-gateway
          env:
            - name: PERMIT_URL
              value: "https://permit-service:8443"
            - name: PERMIT_MTLS_ENABLED
              value: "true"
            - name: PERMIT_MTLS_CA_CERT
              value: "/certs/ca/ca.crt"
            - name: PERMIT_MTLS_CLIENT_CERT
              value: "/certs/tls.crt"
            - name: PERMIT_MTLS_CLIENT_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: mtls-client
              mountPath: /certs
              readOnly: true
            - name: mtls-ca
              mountPath: /certs/ca
              readOnly: true
      volumes:
        - name: mtls-client
          secret:
            secretName: aacp-mtls-client-intent
        - name: mtls-ca
          secret:
            secretName: aacp-mtls-ca-internal
