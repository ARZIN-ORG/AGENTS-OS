
# Domain-3 Recommendation Contract (v1.1 FINAL)

type: recommendation_only
domain: executive_insight

inputs:
  - aacp_trace_ids[]
  - policy_version
  - permit_decisions[]
  - registry_owners[]
  - channel_context
  - time_window

outputs:
  - insight_cards[]:
      fields:
        - title
        - severity (low|med|high|critical)
        - recommendation (text)
        - evidence:
            - trace_ids[]
            - policy_ids[]
            - permit_ids[]
        - confidence (0.0-1.0)
        - assumptions[]  # must be empty unless explicitly sourced
  - narrative_brief:
      fields:
        - summary
        - top_risks[]
        - suggested_questions[]
        - evidence_refs[]
        - prohibited_claims: true  # any claim without evidence_refs is invalid

hard_rules:
  - no_unbacked_claims: true
  - no_operational_publish: true
  - human_distribution_gate: required  # governance approval before external sharing
