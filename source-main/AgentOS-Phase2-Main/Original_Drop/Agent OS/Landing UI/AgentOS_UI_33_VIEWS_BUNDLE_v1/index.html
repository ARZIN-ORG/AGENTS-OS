<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Agent OS</title>
  <link rel="stylesheet" href="./core/styles.css"/>
</head>
<body>
  <header>
    <div class="brand">
      <img src="./assets/agentoslogo.png" alt="AgentOS"/>
      <div>
        <div style="font-weight:700" data-i18n="app.title">Agent OS — Governance Console</div>
        <div class="small" id="currentView"></div>
      </div>
    </div>
    <div class="controls">
      <span class="small" data-i18n="ctl.language">Language</span>
      <select id="langSel">
        <option value="fa-IR">فارسی</option>
        <option value="en-US">English</option>
      </select>
      <span class="small" data-i18n="ctl.theme">Theme</span>
      <select id="themeSel">
        <option value="dark" data-i18n="theme.dark">Dark</option>
        <option value="light" data-i18n="theme.light">Light</option>
      </select>
      <span class="small" data-i18n="ctl.role">Role</span>
      <select id="roleSel"></select>
      <button onclick="Router.go('/')">Home</button>
    </div>
  </header>

  <main>
    <div id="viewRoot"></div>
    <div id="viewsIndex" style="margin-top:12px"></div>
  </main>

  <script src="./core/roles.js"></script>
  <script src="./core/i18n.js"></script>
  <script src="./core/view_registry.js"></script>
  <script src="./core/router.js"></script>
  <script src="./core/app.js"></script>
</body>
</html>
