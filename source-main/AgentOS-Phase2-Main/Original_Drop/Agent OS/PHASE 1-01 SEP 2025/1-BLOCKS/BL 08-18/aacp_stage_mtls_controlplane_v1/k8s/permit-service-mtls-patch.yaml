apiVersion: apps/v1
kind: Deployment
metadata:
  name: permit-service
spec:
  template:
    spec:
      containers:
        - name: permit-service
          env:
            - name: POLICY_PLANE_URL
              value: "https://policy-plane:8443"
            - name: POLICY_PLANE_MTLS_ENABLED
              value: "true"
            - name: POLICY_PLANE_MTLS_CA_CERT
              value: "/certs/ca/ca.crt"
            - name: POLICY_PLANE_MTLS_CLIENT_CERT
              value: "/certs/tls.crt"
            - name: POLICY_PLANE_MTLS_CLIENT_KEY
              value: "/certs/tls.key"
            - name: AUDIT_SINK_URL
              value: "https://audit-sink:8443"
            - name: AUDIT_SINK_MTLS_ENABLED
              value: "true"
            - name: AUDIT_SINK_MTLS_CA_CERT
              value: "/certs/ca/ca.crt"
            - name: AUDIT_SINK_MTLS_CLIENT_CERT
              value: "/certs/tls.crt"
            - name: AUDIT_SINK_MTLS_CLIENT_KEY
              value: "/certs/tls.key"
          volumeMounts:
            - name: mtls-client
              mountPath: /certs
              readOnly: true
            - name: mtls-ca
              mountPath: /certs/ca
              readOnly: true
      volumes:
        - name: mtls-client
          secret:
            secretName: aacp-mtls-client-permit
        - name: mtls-ca
          secret:
            secretName: aacp-mtls-ca-internal
