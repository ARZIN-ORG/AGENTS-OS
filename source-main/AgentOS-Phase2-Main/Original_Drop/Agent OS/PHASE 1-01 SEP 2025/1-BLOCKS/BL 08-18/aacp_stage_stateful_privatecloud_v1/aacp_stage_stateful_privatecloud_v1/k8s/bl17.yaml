apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl17-intent-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bl17-intent-gateway
  template:
    metadata:
      labels:
        app: bl17-intent-gateway
    spec:
      containers:
        - name: bl17
          image: your-registry/bl17-intent-gateway:0.2.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://aacp:aacp_pass@aacp-postgres:5432/aacp_state"
            - name: AACP_PERMIT_URL
              value: "http://permit-service:8080"
            - name: BL13_RECOMMENDATION_URL
              value: "http://recommendation-plane:8080"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: intent-gateway
spec:
  selector:
    app: bl17-intent-gateway
  ports:
    - port: 8080
      targetPort: 8080
      name: http
