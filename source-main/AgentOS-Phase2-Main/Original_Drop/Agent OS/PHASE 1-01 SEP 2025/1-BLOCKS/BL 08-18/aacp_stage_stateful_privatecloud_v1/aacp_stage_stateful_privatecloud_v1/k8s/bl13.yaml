apiVersion: v1
kind: ConfigMap
metadata:
  name: bl13-config
data:
  AACP_EXEC_REQUEST_TOPIC: "aacp.exec.request"
  AACP_AUDIT_STRICT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl13-recommendation-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bl13-recommendation-plane
  template:
    metadata:
      labels:
        app: bl13-recommendation-plane
    spec:
      containers:
        - name: bl13
          image: your-registry/bl13-recommendation-plane:0.2.0
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg2://aacp:aacp_pass@aacp-postgres:5432/aacp_state"
            - name: AACP_PERMIT_URL
              value: "http://permit-service:8080"
            - name: AACP_AUDIT_SINK_URL
              value: "http://audit-sink:8080"
          envFrom:
            - configMapRef:
                name: bl13-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-plane
spec:
  selector:
    app: bl13-recommendation-plane
  ports:
    - port: 8080
      targetPort: 8080
      name: http
