apiVersion: batch/v1
kind: CronJob
metadata:
  name: aacp-cert-rotation
spec:
  schedule: "0 3 * * *" # daily 03:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: aacp-cert-rotation
          restartPolicy: Never
          containers:
            - name: rotator
              image: bitnami/kubectl:latest
              command: ["python","/app/rotate_certs.py"]
              env:
                - name: CERT_TTL_HOURS
                  value: "168"
                - name: DRY_RUN
                  value: "true"
                - name: ROTATION_TARGETS_JSON
                  value: |
                    [
                      {"namespace":"aacp","name":"intent-gateway","kind":"deployment","secret_name":"aacp-mtls-client-intent"},
                      {"namespace":"aacp","name":"permit-service","kind":"deployment","secret_name":"aacp-mtls-client-permit"},
                      {"namespace":"aacp","name":"bl19-governance-console","kind":"deployment","secret_name":"bl19-mtls-client"}
                    ]
              volumeMounts:
                - name: app
                  mountPath: /app
          volumes:
            - name: app
              configMap:
                name: aacp-cert-rotation-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aacp-cert-rotation-script
data:
  rotate_certs.py: |
    # -*- coding: utf-8 -*-
    from __future__ import annotations
    
    import os
    import sys
    import json
    import subprocess
    from dataclasses import dataclass
    from typing import Dict, List, Optional, Tuple
    
    @dataclass(frozen=True)
    class Target:
        namespace: str
        name: str
        kind: str  # deployment|statefulset
        secret_name: str
        secret_cert_key: str = "tls.crt"
        secret_key_key: str = "tls.key"
        ca_secret_name: Optional[str] = None
        ca_secret_key: str = "ca.crt"
    
    class PkiProvider:
        """Implement this using your PKI of choice.
        Must return PEM strings.
        """
        def issue(self, common_name: str, dns_sans: List[str], ttl_hours: int) -> Tuple[str, str]:
            raise NotImplementedError
    
    class StubPkiProvider(PkiProvider):
        def issue(self, common_name: str, dns_sans: List[str], ttl_hours: int) -> Tuple[str, str]:
            # This stub is intentional: no fake security. Replace in your environment.
            raise RuntimeError("PKI provider is not configured. Implement Vault/cert-manager integration.")
    
    def sh(cmd: List[str]) -> str:
        p = subprocess.run(cmd, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
        return p.stdout.strip()
    
    def load_targets() -> List[Target]:
        raw = os.getenv("ROTATION_TARGETS_JSON", "")
        if not raw:
            raise RuntimeError("ROTATION_TARGETS_JSON is required")
        data = json.loads(raw)
        targets: List[Target] = []
        for t in data:
            targets.append(Target(**t))
        return targets
    
    def patch_secret(namespace: str, secret_name: str, data_map: Dict[str, str]) -> None:
        # kubectl patch secret <name> --type merge -p '{"data":{...}}'
        payload = {"data": data_map}
        sh(["kubectl", "-n", namespace, "patch", "secret", secret_name, "--type", "merge", "-p", json.dumps(payload)])
    
    def rollout_restart(namespace: str, kind: str, name: str) -> None:
        if kind not in ("deployment", "statefulset"):
            raise RuntimeError(f"unsupported kind: {kind}")
        sh(["kubectl", "-n", namespace, "rollout", "restart", f"{kind}/{name}"])
    
    def main() -> int:
        ttl_hours = int(os.getenv("CERT_TTL_HOURS", "168"))  # 7 days default
        dry_run = os.getenv("DRY_RUN", "false").lower() in ("1","true","yes")
    
        targets = load_targets()
        pki: PkiProvider = StubPkiProvider()
    
        report = {
            "action": "cert_rotation",
            "ttl_hours": ttl_hours,
            "dry_run": dry_run,
            "targets": [],
            "status": "started",
        }
    
        try:
            for t in targets:
                # CN + SANs are policy-controlled outside. Keep deterministic.
                common_name = f"{t.name}.{t.namespace}.svc"
                dns_sans = [common_name, f"{t.name}.{t.namespace}", t.name]
                if dry_run:
                    report["targets"].append({"target": t.__dict__, "result": "dry_run_skip"})
                    continue
    
                crt_pem, key_pem = pki.issue(common_name=common_name, dns_sans=dns_sans, ttl_hours=ttl_hours)
    
                # Base64 encoding is normally needed for secret patch data. We keep it explicit:
                import base64
                data_map = {
                    t.secret_cert_key: base64.b64encode(crt_pem.encode("utf-8")).decode("ascii"),
                    t.secret_key_key: base64.b64encode(key_pem.encode("utf-8")).decode("ascii"),
                }
                patch_secret(t.namespace, t.secret_name, data_map)
                rollout_restart(t.namespace, t.kind, t.name)
    
                report["targets"].append({"target": t.__dict__, "result": "rotated_and_restarted"})
    
            report["status"] = "ok"
            print(json.dumps(report, ensure_ascii=False))
            return 0
    
        except Exception as e:
            report["status"] = "failed"
            report["error"] = str(e)
            print(json.dumps(report, ensure_ascii=False), file=sys.stderr)
            return 2
    
    if __name__ == "__main__":
        raise SystemExit(main())
