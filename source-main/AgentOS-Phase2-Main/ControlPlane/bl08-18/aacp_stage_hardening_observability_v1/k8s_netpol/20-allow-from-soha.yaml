apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-soha
  namespace: arzin-aacp
spec:
  podSelector: {}
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: soha
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8083
  policyTypes:
  - Ingress
