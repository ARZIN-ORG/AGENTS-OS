apiVersion: apps/v1
kind: Deployment
metadata:
  name: bl19-governance-console
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bl19-governance-console
  template:
    metadata:
      labels:
        app: bl19-governance-console
    spec:
      containers:
        - name: bl19
          image: your-registry/bl19-governance-console:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: AUDIT_SINK_URL
              value: "http://audit-sink:8080"
            - name: DEFAULT_WINDOW_HOURS
              value: "24"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: governance-console
spec:
  selector:
    app: bl19-governance-console
  ports:
    - port: 8080
      targetPort: 8080
      name: http
