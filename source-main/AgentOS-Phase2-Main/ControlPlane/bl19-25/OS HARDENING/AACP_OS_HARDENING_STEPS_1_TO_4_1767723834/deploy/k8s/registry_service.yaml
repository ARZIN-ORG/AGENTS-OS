apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry_service
  namespace: aacp-phase1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: registry_service
  template:
    metadata:
      labels:
        app: registry_service
    spec:
      containers:
        - name: registry_service
          image: aacp/registry_service:v1
          ports:
            - containerPort: 8000
          env:
            - name: AACP_DEV_SECRET
              valueFrom:
                secretKeyRef:
                  name: aacp-dev-secret
                  key: secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: registry_service
  namespace: aacp-phase1
spec:
  selector:
    app: registry_service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
