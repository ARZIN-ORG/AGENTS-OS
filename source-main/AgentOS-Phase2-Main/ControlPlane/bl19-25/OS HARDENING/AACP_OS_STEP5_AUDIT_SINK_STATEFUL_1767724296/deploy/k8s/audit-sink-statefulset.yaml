apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: audit-sink-service
  namespace: aacp-system
spec:
  serviceName: audit-sink-service
  replicas: 1
  selector:
    matchLabels:
      app: audit-sink-service
  template:
    metadata:
      labels:
        app: audit-sink-service
    spec:
      containers:
        - name: audit-sink
          image: aacp/audit-sink:phase1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: AACP_AUDIT_SQLITE_PATH
              value: /var/lib/aacp/audit.db
            - name: AACP_AUDIT_ENFORCE_CHAIN
              value: "false"
            - name: AACP_AUDIT_RETENTION_DAYS
              value: "365"
            - name: AACP_AUDIT_ENABLE_RETENTION
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: audit-data
              mountPath: /var/lib/aacp
  volumeClaimTemplates:
    - metadata:
        name: audit-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
