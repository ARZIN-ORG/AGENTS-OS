openapi: 3.0.3
info:
  title: ARZIN Policy Plane Service
  version: "1.0"
  description: >
    BL-07 Control Plane service. Stores versioned policies and publishes active versions
    for scoped enforcement by Interceptor/SDK. Phase 1 allows observe/recommend only.
servers:
  - url: http://policy-plane:8081
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200": { description: OK }
  /v1/policies:
    post:
      summary: Create policy (draft)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "400": { description: Validation error }
    get:
      summary: List policies
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: policy_id
          schema: { type: string }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Policy" }
  /v1/policies/{policy_id}/versions/{version}:
    get:
      summary: Get a policy version
      parameters:
        - in: path
          name: policy_id
          required: true
          schema: { type: string }
        - in: path
          name: version
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "404": { description: Not found }
  /v1/policies/{policy_id}/publish:
    post:
      summary: Publish a policy version for a scope (activates it)
      parameters:
        - in: path
          name: policy_id
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: integer }
          description: Policy version being published (optimistic)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyPublish" }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPublication" }
        "409": { description: Version conflict }
  /v1/policies/{policy_id}/rollback:
    post:
      summary: Roll back publication to previous active version for the same scope
      parameters:
        - in: path
          name: policy_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyRollback" }
      responses:
        "200":
          description: Rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyPublication" }
        "404": { description: No previous version }
  /v1/effective-policy:
    get:
      summary: Get effective policy for agent/channel/topic (fast path for Interceptor/SDK)
      parameters:
        - in: query
          name: agent_id
          required: true
          schema: { type: string }
        - in: query
          name: agent_class
          required: true
          schema: { type: string }
        - in: query
          name: channel_id
          required: true
          schema: { type: string }
        - in: query
          name: topic
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Effective policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EffectivePolicy" }
        "404": { description: No policy found }
components:
  schemas:
    PolicyStatus:
      type: string
      enum: [draft, active, deprecated]
    DecisionClass:
      type: string
      enum: [observe, recommend]
    TopicRule:
      type: object
      required: [topic]
      properties:
        topic: { type: string }
        pattern:
          type: string
          enum: [literal, prefix]
          default: literal
    PolicyScope:
      type: object
      required: [agent_class, channel_id, topics]
      properties:
        agent_class: { type: string }
        agent_id: { type: string, nullable: true }
        channel_id: { type: string }
        topics:
          type: array
          items: { $ref: "#/components/schemas/TopicRule" }
    PolicyConstraints:
      type: object
      required: [decision_classes, signature_required]
      properties:
        decision_classes:
          type: array
          items: { $ref: "#/components/schemas/DecisionClass" }
        signature_required: { type: boolean }
        max_payload_bytes: { type: integer, default: 1048576 }
        ttl_seconds_min: { type: integer, default: 1 }
        ttl_seconds_max: { type: integer, default: 300 }
    PolicyCreate:
      type: object
      required: [policy_id, version, scope, constraints]
      properties:
        policy_id: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/PolicyStatus", default: draft }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        constraints: { $ref: "#/components/schemas/PolicyConstraints" }
        metadata:
          type: object
          additionalProperties: true
    Policy:
      type: object
      required: [policy_id, version, status, scope, constraints, created_at]
      properties:
        policy_id: { type: string }
        version: { type: integer }
        status: { $ref: "#/components/schemas/PolicyStatus" }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        constraints: { $ref: "#/components/schemas/PolicyConstraints" }
        metadata:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }
    PolicyPublish:
      type: object
      required: [scope]
      properties:
        scope: { $ref: "#/components/schemas/PolicyScope" }
        reason: { type: string }
    PolicyRollback:
      type: object
      required: [scope, reason]
      properties:
        scope: { $ref: "#/components/schemas/PolicyScope" }
        reason: { type: string }
    PolicyPublication:
      type: object
      required: [policy_id, active_version, scope, published_at]
      properties:
        policy_id: { type: string }
        active_version: { type: integer }
        scope: { $ref: "#/components/schemas/PolicyScope" }
        published_at: { type: string, format: date-time }
        note: { type: string, nullable: true }
    EffectivePolicy:
      type: object
      required: [policy_id, active_version, constraints]
      properties:
        policy_id: { type: string }
        active_version: { type: integer }
        constraints: { $ref: "#/components/schemas/PolicyConstraints" }
