<div class="grid cols2">
  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="h1">Risk Monitor</div>
        <p class="p">Layer: OS • Mode: suggest • Enforced: Role→View→Action</p>
      </div>
      <span class="badge">Suggest</span>
    </div>
    <div style="height:12px"></div>
    <div class="row">
      <input class="input" id="q" placeholder="filter / query..." />
      <button class="btn secondary" id="refreshBtn">Refresh</button>
      <button class="btn" id="primaryBtn">Generate</button>
    </div>
    <div style="height:12px"></div>
    <table class="table"><thead><tr><th>Key</th><th>Value</th></tr></thead><tbody id="rows"><tr><td>Status</td><td><span class="badge">pending</span></td></tr></tbody></table>
    <div style="height:10px"></div>
  </section>
  <aside class="card">
    <div class="h1">Audit Context</div>
    <p class="p">Actionable flows must be traceable. UI surfaces the audit context required by BL-08.</p>
    <div style="height:12px"></div>
    <table class="table"><thead><tr><th>Field</th><th>Value</th></tr></thead>
      <tbody>
        <tr><td>trace_id</td><td><code id="traceId">auto</code></td></tr>
        <tr><td>policy_version</td><td><code id="policyVersion">latest</code></td></tr>
        <tr><td>approver</td><td><code id="approver">human-required</code></td></tr>
      </tbody>
    </table>
    <div style="height:12px"></div>
    <div class="row">
      <button class="btn secondary" id="copyTraceBtn">Copy Trace</button>
      <button class="btn secondary" id="openManifestBtn">Open Manifest</button>
    </div>
  </aside>
</div>
