version: '3.8'
services:
  governance-console-api:
    build: ./services/governance-console-api
    ports:
      - "8080:8080"
    environment:
      - JWT_PUBLIC_KEY_PEM=${JWT_PUBLIC_KEY_PEM:-}
      - JWT_ISSUER=${JWT_ISSUER:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - RBAC_ADMIN_ROLE=${RBAC_ADMIN_ROLE:-agentos_admin}
      - BL06_REGISTRY_URL=${BL06_REGISTRY_URL:-http://bl06-agent-registry:8080}
      - BL07_POLICY_URL=${BL07_POLICY_URL:-http://bl07-policy-plane:8080}
      - BL08_PERMIT_URL=${BL08_PERMIT_URL:-http://bl08-permit-service:8080}
      - BL19_GOV_URL=${BL19_GOV_URL:-http://bl19-governance-console:8080}
      - BL17_INTENT_URL=${BL17_INTENT_URL:-http://bl17-intent-gateway:8080}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
    restart: unless-stopped
