openapi: 3.0.3
info:
  title: ARZIN Agent Registry Service
  version: "1.0"
  description: >
    BL-06 Control Plane service. Stores Agent identity, status, allowed channels/topics,
    and Phase-1 decision classes (observe/recommend only).
servers:
  - url: http://agent-registry:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/agents:
    post:
      summary: Register an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Validation error
    get:
      summary: List agents (filterable)
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: agent_class
          schema: { type: string }
        - in: query
          name: channel_id
          schema: { type: string }
      responses:
        "200":
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /v1/agents/{agent_id}:
    get:
      summary: Get agent
      parameters:
        - in: path
          name: agent_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Not found
    put:
      summary: Replace agent allowlist/metadata (version bump)
      parameters:
        - in: path
          name: agent_id
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: integer }
          description: Current version for optimistic concurrency control
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          description: Version conflict
  /v1/agents/{agent_id}/status:
    post:
      summary: Change agent status (version bump)
      parameters:
        - in: path
          name: agent_id
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStatusChange"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          description: Version conflict
  /v1/agents/{agent_id}/revoke:
    post:
      summary: Revoke an agent (status=revoked) (version bump)
      parameters:
        - in: path
          name: agent_id
          required: true
          schema: { type: string }
        - in: header
          name: If-Match
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /v1/agents/{agent_id}/effective-allowlist:
    get:
      summary: Effective allowlist for Interceptor/SDK fast path
      parameters:
        - in: path
          name: agent_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveAllowlist"
components:
  schemas:
    AgentStatus:
      type: string
      enum: [active, suspended, revoked]
    AgentClass:
      type: string
      enum: [governance, orchestration, execution, audit, observer, redteam, resilience, management, integration, other]
    DecisionClass:
      type: string
      enum: [observe, recommend]
    TopicRule:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
        pattern:
          type: string
          enum: [literal, prefix]
          default: literal
    ChannelAllowlist:
      type: object
      required: [channel_id, topics]
      properties:
        channel_id:
          type: string
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicRule"
    AgentCreate:
      type: object
      required:
        - agent_id
        - agent_class
        - agent_version
        - public_key_id
        - decision_classes
        - channels
      properties:
        agent_id: { type: string }
        agent_class: { $ref: "#/components/schemas/AgentClass" }
        agent_version: { type: string }
        public_key_id: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus", default: active }
        decision_classes:
          type: array
          items: { $ref: "#/components/schemas/DecisionClass" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelAllowlist" }
        metadata:
          type: object
          additionalProperties: true
    AgentUpdate:
      type: object
      required:
        - agent_version
        - public_key_id
        - decision_classes
        - channels
      properties:
        agent_version: { type: string }
        public_key_id: { type: string }
        decision_classes:
          type: array
          items: { $ref: "#/components/schemas/DecisionClass" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelAllowlist" }
        metadata:
          type: object
          additionalProperties: true
    AgentStatusChange:
      type: object
      required: [status, reason]
      properties:
        status: { $ref: "#/components/schemas/AgentStatus" }
        reason: { type: string }
    Agent:
      type: object
      required:
        - agent_id
        - agent_class
        - agent_version
        - public_key_id
        - status
        - decision_classes
        - channels
        - version
        - created_at
        - updated_at
      properties:
        agent_id: { type: string }
        agent_class: { $ref: "#/components/schemas/AgentClass" }
        agent_version: { type: string }
        public_key_id: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus" }
        decision_classes:
          type: array
          items: { $ref: "#/components/schemas/DecisionClass" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelAllowlist" }
        metadata:
          type: object
          additionalProperties: true
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EffectiveAllowlist:
      type: object
      required: [agent_id, status, version, decision_classes, channels]
      properties:
        agent_id: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus" }
        version: { type: integer }
        decision_classes:
          type: array
          items: { $ref: "#/components/schemas/DecisionClass" }
        channels:
          type: array
          items: { $ref: "#/components/schemas/ChannelAllowlist" }
