apiVersion: apps/v1
kind: Deployment
metadata:
  name: permit-service
  namespace: arzin-aacp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: permit-service
  template:
    metadata:
      labels:
        app: permit-service
    spec:
      containers:
        - name: permit-service
          image: arzin/bl08-permit-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: aacp-config
            - secretRef:
                name: aacp-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: permit-service
  namespace: arzin-aacp
spec:
  selector:
    app: permit-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
